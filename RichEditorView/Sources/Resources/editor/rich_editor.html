<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
        <meta name="supported-color-schemes" content="light dark">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <style>
            /* Inlined so the correct background paints on the very first frame,
               before the external stylesheets below finish loading. */
            :root { color-scheme: light dark; }
            html, body { background-color: #F8F9FA; }
            @media (prefers-color-scheme: dark) {
                html, body { background-color: #212731; }
            }
        </style>
        <link rel="stylesheet" type="text/css" href="normalize.css">
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    
    <body>
        <div id="container">
            <div id="editor" contentEditable="true" placeholder="" class="placeholder"></div>
        </div>
        
        <script type="text/javascript" src="rich_editor.js"></script>
    </body>
</html>
